name: Test and Publish Docker Package

on:
  push:
    branches:
      - main

jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - run: npm install

      - run: npm test

      - name: Build Docker image
        run: docker build -t ghcr.io/${{ github.repository }}/platform-demo:${{ github.sha }} .

      - name: Test Docker image
        run: |
          docker run -d -p 8080:8080 --name demo-container ghcr.io/${{ github.repository }}/platform-demo:${{ github.sha }}
          
          sleep 5
          
          docker logs demo-container
          
          curl --retry 5 --retry-connrefused --retry-delay 2 -f http://127.0.0.1:8080/health

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to GitHub Packages
        run: docker push ghcr.io/${{ github.repository }}/platform-demo:${{ github.sha }}
